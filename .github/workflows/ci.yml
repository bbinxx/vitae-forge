name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitae_ci
          POSTGRES_PASSWORD: vitae_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitae_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Test client, document projects and browser endpoint contracts
        run: python -m unittest discover -s tests -v
      - name: Test PostgreSQL repository
        env:
          DATABASE_URL: postgresql://postgres:vitae_ci@127.0.0.1:5432/vitae_ci
        run: python -m unittest discover -s tests -p test_postgres_repository.py -v
      - name: Build application without a TeX distribution
        run: docker build -t vitae-forge:ci .
      - name: Test inside compiler-free image
        run: |
          docker run --rm --mount type=bind,src="$PWD/tests",dst=/tests,readonly \
            --entrypoint python vitae-forge:ci -m unittest discover -s /tests -v
          docker run --rm --entrypoint python vitae-forge:ci -c \
            "import shutil; assert all(shutil.which(x) is None for x in ('pdflatex','xelatex','lualatex','latexmk','bibtex','biber'))"
