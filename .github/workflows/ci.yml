name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Test client, document projects and browser endpoint contracts
        run: python -m unittest discover -s tests -v
      - name: Build application without a TeX distribution
        run: docker build -t vitae-forge:ci .
      - name: Test inside compiler-free image
        run: |
          docker run --rm --mount type=bind,src="$PWD/tests",dst=/tests,readonly \
            --entrypoint python vitae-forge:ci -m unittest discover -s /tests -v
          docker run --rm --entrypoint python vitae-forge:ci -c \
            "import shutil; assert all(shutil.which(x) is None for x in ('pdflatex','xelatex','lualatex','latexmk','bibtex','biber'))"
