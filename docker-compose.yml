services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${HOST_PORT:-5050}:5050"
    env_file:
      - .env
    environment:
      PORT: "5050"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    volumes:
      - uploads:/app/assets
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 190s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
