services:
  - type: web
    name: resume-studio
    env: docker
    region: frankfurt
    plan: starter
    dockerCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PASSCODE_HASH
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
