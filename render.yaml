services:
  - type: web
    name: vitae-forge
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TEXCOMPILER_URL
        sync: false
      - key: TEXCOMPILER_API_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5050
      - key: AUTH_REQUIRED
        value: "true"
