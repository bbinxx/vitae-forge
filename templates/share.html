<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - {{ ROLE_NAME }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0d0f14 0%, #1a1d24 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            width: 100%;
            max-width: 960px;
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.333rem;
            font-weight: 700;
            border: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(109,40,217,0.3);
        }
        .info h1 {
            margin: 0 0 4px 0;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .info p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.933rem;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8667rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6d28d9, #5b21b6);
            color: white;
            box-shadow: 0 4px 12px rgba(109,40,217,0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(109,40,217,0.35);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #374151;
            color: #e2e8f0;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.05);
            border-color: #6d28d9;
        }
        .viewer-container {
            width: 100%;
            max-width: 960px;
            flex: 1;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin: 0 24px 40px;
            min-height: 600px;
            max-height: 85vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 16px;
                padding: 24px 16px;
            }
            .profile { flex-direction: column; }
            .actions { width: 100%; justify-content: center; }
            .btn { flex: 1; justify-content: center; }
            .viewer-container {
                border-radius: 0;
                margin: 0;
                min-height: 50vh;
                max-height: none;
                height: calc(100vh - 200px);
            }
            .info h1 { font-size: 1.2rem; }
        }
        @media (max-width: 480px) {
            .header { padding: 20px 12px; }
            .avatar { width: 48px; height: 48px; font-size: 1.133rem; }
            .info h1 { font-size: 1.0667rem; }
            .info p { font-size: 0.8rem; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="profile">
            <div class="avatar">{{ USER_INITIAL }}</div>
            <div class="info">
                <h1>{{ USER_NAME }}</h1>
                <p>Application for {{ ROLE_NAME }}</p>
            </div>
        </div>
        <div class="actions">
            <a href="{{ PDF_URL }}" download class="btn btn-outline">Download PDF</a>
            <a href="mailto:{{ USER_EMAIL }}" class="btn btn-primary">Contact Me</a>
        </div>
    </div>
    
    <div class="viewer-container">
        <iframe src="{{ PDF_URL }}#toolbar=0" type="application/pdf"></iframe>
    </div>
</body>
</html>
