<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Studio — Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/studio.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-brand">
    <span class="brand-icon"></span>
    <span class="brand-name">Resume Studio</span>
  </div>
  <button class="hamburger" onclick="toggleHeaderNav()" aria-label="Toggle navigation">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <nav class="header-nav" id="header-nav">
    <button id="tab-tracker"   class="nav-btn active"        onclick="window.switchTab('tracker')">Applications</button>
    <button id="tab-saved-resumes" class="nav-btn"    onclick="window.switchTab('saved-resumes')">Saved Resumes</button>
    <button id="tab-templates" class="nav-btn"         onclick="window.switchTab('templates')">Templates</button>
    <button id="tab-library"   class="nav-btn"        onclick="window.switchTab('library')">Library</button>
    <button id="tab-settings"  class="nav-btn"        onclick="window.switchTab('settings')">Settings</button>
  </nav>
  <div class="header-actions" id="header-actions">
    <span id="user-badge" style="font-size:12px;color:var(--text-muted,#94a3b8);margin-right:8px"></span>
    <button class="btn btn-ghost btn-sm" onclick="exportBackup()"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">archive</span> Export Backup</button>
    <label class="btn btn-ghost btn-sm" style="cursor:pointer;margin:0"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">unarchive</span> Import Backup<input type="file" accept=".json" onchange="importBackup(event)" style="display:none"></label>
    <button class="btn btn-ghost btn-sm" onclick="handleLogout()" style="color:#f87171"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">logout</span> Logout</button>
  </div>
</header>
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

<main class="main-content">

<!-- ═══════════════════ APPLICATIONS ═══════════════════ -->
<div id="tracker-view" class="view active">

  <!-- App Header -->
  <div class="apps-header">
    <div class="apps-header-left">
      <h2 class="apps-title">My Applications</h2>
      <span id="apps-count-badge" class="apps-count">0</span>
    </div>
    <div class="apps-header-right">
      <input id="app-search" type="text" class="apps-search-input" placeholder="Search applications…" style="max-width: 280px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);">
      <select id="app-sort" class="apps-search-input" style="max-width: 180px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.7333rem; cursor: pointer;">
        <option value="updated_desc">Newest First</option>
        <option value="updated_asc">Oldest First</option>
        <option value="company_asc">Company A→Z</option>
        <option value="company_desc">Company Z→A</option>
        <option value="status_asc">Status A→Z</option>
        <option value="priority_desc">Priority High→Low</option>
        <option value="priority_asc">Priority Low→High</option>
      </select>
      <span id="tracker-save-indicator" class="save-indicator"></span>
      <button class="btn btn-primary btn-sm" onclick="window.openNewAppModal()">
        <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">add</span> New Application
      </button>
    </div>
  </div>

  <!-- Apps Stats -->
  <div id="apps-stats-container" class="apps-stats"></div>

  <!-- Grid Layout -->
  <div class="apps-layout">
    <div id="apps-grid" class="apps-container"></div>
  </div>

</div>

<!-- ═══════════════════ SAVED RESUMES ═══════════════════ -->
<div id="saved-resumes-view" class="view hidden">
  <div class="sr-toolbar">
    <button class="btn btn-primary" onclick="addNewRecipe()">+ Create from Scratch</button>
    <button class="btn btn-secondary" onclick="addRecipeFromApp()">+ Clone from Application</button>
    <input type="text" id="sr-filter" placeholder="Filter saved resumes..." style="margin-left:auto;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text-primary);font-size:12px;width:240px;">
  </div>
  <div class="sr-container">
    <div id="sr-list" class="sr-list"></div>
    <div id="sr-empty" class="editor-placeholder" style="margin-top:0">No saved resumes found.</div>
  </div>
</div>

<!-- ═══════════════════ TEMPLATES ═══════════════════ -->
<div id="templates-view" class="view hidden">
  <div class="split-layout" style="grid-template-columns: 240px 1fr 1fr;">

    <aside class="sidebar">
      <div class="sidebar-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="section-title" style="margin-bottom:0;">Resume Templates</div>
          <button class="btn btn-ghost btn-sm" onclick="window.createNewTemplate('resume')" style="padding:4px 8px;font-size:11px;">+ New</button>
        </div>
        <div id="templates-list-resume" class="roles-list"></div>
      </div>
      <div class="sidebar-section" style="margin-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="section-title" style="margin-bottom:0;">Cover Letter Templates</div>
          <button class="btn btn-ghost btn-sm" onclick="window.createNewTemplate('cover_letter')" style="padding:4px 8px;font-size:11px;">+ New</button>
        </div>
        <div id="templates-list-cover" class="roles-list"></div>
      </div>
      <div class="sidebar-section" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
        <button class="btn btn-secondary btn-sm" onclick="window.showTemplateGuide()" style="width:100%;font-size:11px">
          <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-3px">book</span> Template Guide
        </button>
      </div>
    </aside>

    <div class="panel-main p-6" style="border-right: 1px solid var(--border);">
      <div id="template-editor-empty" class="editor-placeholder">Select a template to view</div>

      <div id="template-editor-form" class="editor-form hidden" style="display:flex;flex-direction:column;height:100%">
        <!-- Populated by JS -->
      </div>
    </div>
    
    <div class="panel-preview" style="background:var(--bg-main); display:flex; flex-direction:column;">
      <div style="padding:14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--bg-card);">
        <span style="font-size:12px; font-weight:600; color:var(--text-primary)">Live Preview</span>
        <button id="template-preview-btn" class="btn btn-secondary btn-sm" onclick="window.previewCurrentTemplate()">
          <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">refresh</span> Update Preview
        </button>
      </div>
      <div id="template-preview-container" class="template-preview-loading" style="flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div id="template-preview-empty" style="color:var(--text-muted); font-size:12px;">Click 'Update Preview' to generate PDF</div>
        <iframe id="template-preview-iframe" class="hidden" style="width:100%; height:100%; border:none; border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></iframe>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════════════ LIBRARY ═══════════════════ -->
<div id="library-view" class="view hidden">
  <div class="split-layout">

    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-title">Categories</div>
        <div id="lib-category-list" class="roles-list"></div>
      </div>
    </aside>

    <div class="panel-main p-6">
      <div id="lib-editor-container" class="library-container"></div>
    </div>

  </div>
</div>



<!-- ═══════════════════ SETTINGS ═══════════════════ -->
<div id="settings-view" class="view hidden">
  <div class="panel-main p-6" style="max-width:800px;margin:0 auto;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-top:20px;">
    <div class="editor-form-header">System Settings</div>
    <div id="settings-container"></div>
  </div>
</div>

</main>

<!-- Tracker Modal (injected by tracker.js) -->
<div id="tracker-modal" class="modal-overlay hidden" onclick="this.style.display='none'"></div>

<!-- Toast Notification Container -->
<div id="toast-container"></div>
<script>
window.addEventListener('error', function(e) {
    const toast = document.createElement('div');
    toast.style.cssText = 'background:red;color:white;padding:10px;margin-bottom:5px;border-radius:4px;z-index:999999;position:relative;';
    toast.textContent = 'JS Error: ' + e.message;
    document.getElementById('toast-container').appendChild(toast);
});
window.handleLogout = function() {
    localStorage.removeItem('token');
    window.location.href = '/login';
};

fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') } }).then(r => r.ok ? r.json() : null).then(user => {
    const badge = document.getElementById('user-badge');
    if (badge && user) badge.textContent = user.email || user.username;
}).catch(() => {});
</script>


<script src="/static/js/auth_interceptor.js"></script>
<script type="module" src="/static/js/main.js?v=6"></script>
</body>
</html>
